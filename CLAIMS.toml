The developer-machine coverage spike, recorded as the dated non-goal the plan allows rather
than a shipped mode. Measured: a bare `RUSTC_WRAPPER` set in `.cargo/config.toml` with a
plain `cargo build` produces no report and holds nothing, because the wrapper passes a unit
through whenever the driver's policy switch (`BUILDCLAMP_POLICY` / the run directory) is
absent — by design, so that a stray `RUSTC_WRAPPER` in a shell cannot silently mutate a
target directory. The manual four-variable path (`RUSTC_WRAPPER` + `BUILDCLAMP_POLICY` +
`BUILDCLAMP_RUN` + `BUILDCLAMP_MODE`) does hold units but gets no sweep and no aggregated
report, and the editor sets none of them; rust-analyzer additionally runs proc-macro
expansion through its own server rather than rustc, which a rustc wrapper never sees. The
IDE inner-loop latency the full spike would measure needs a real editor and is not measured
in CI. So the honest status is a non-goal, and the coverage table says so per row.
"""
