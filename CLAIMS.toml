# Every claim this project makes in the present tense, and the thing that makes it true.
#
# ## Why this file exists
#
# This project's credibility is that it does not overstate, and it has overstated three
# times in one week — each time in a document, never in the code:
#
#   * `README.md:3` said every proc-macro runs inside a capability envelope. No compile
#     unit is held; `crates/cli/src/main.rs` passes `HoldCompile` straight through.
#   * Its positioning said "nobody has shipped this" about per-proc-macro handling.
#     `cargo-acl` sandboxes rustc, which holds every proc-macro coarsely but really.
#   * `REPORT_FORMAT_VERSION`'s own doc comment described a contract no consumer honoured.
#
# Prose drifts from code silently because nothing compiles it. This file is the join: a
# claim, where it is made, what it assumes, and the evidence — a named test, or a dated
# search for an absence. `crates/cli/tests/claims.rs` enforces the join.
#
# ## The rule for absence claims
#
# A claim that *nobody else* does something is the most dangerous kind, because it is
# false the moment a competitor ships and nothing tells you. Every one needs `search`,
# `sources` and `checked`, and goes stale on a clock.
#
# ## What this file is not
#
# Not a marketing register. A claim belongs here when it is load-bearing — when a reader
# deciding whether to trust the tool would act on it.

version = 1

# The freshness window for an absence claim, in days. An absence claim older than this
# fails the gate: it describes a search nobody has repeated, and the competitor it is
# about has had four months to ship.
absence_max_age_days = 120

