assumptions = [
  "ONE SHARED POLICY PER COMPILATION, not per macro: the rustc has already loaded every proc-macro in its closure, so the report names which could have been responsible and never which was",
  "opt-in: this is every rustc in the graph rather than one process per crate with a build script, and the overhead measurement is the gate for making it default",
  "a proc-macro can detect that it is held and emit different code; cargo-acl's README says the same",
  "a compile that cannot be held passes through rather than failing the build, because refusing every crate in a graph over a sandbox that would not start is how a tool gets uninstalled",
]
