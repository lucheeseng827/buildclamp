  "test:a_held_compile_refuses_what_the_proc_macro_does_at_expansion_time",
  "test:a_refusal_inside_a_compile_names_the_macros_that_could_have_been_responsible",
  "test:an_ordinary_build_survives_having_its_compile_units_held",
]
