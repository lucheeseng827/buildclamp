[[claim]]
id = "the-sandbox-crate-surface-is-frozen"
kind = "capability"
text = "`buildclamp-sandbox`'s published surface cannot change — in either direction — without a commit that says so."
where = ["CHANGELOG.md"]
context = """
Two halves, because neither is sufficient. The compiler catches removals and signature
changes, by using every frozen item at its exact type; a committed snapshot catches
additions, which a compiler cannot see. `bpf` and `bpfcheck` are listed in the snapshot but
deliberately NOT frozen — they exist so a reviewer can read and execute the filter, and a
syscall added to the tables changes that surface.
"""
assumptions = [
  "the snapshot is produced by reading declarations out of the source rather than from rustdoc JSON, which is nightly-only; it therefore over-lists, including items declared `pub` inside private modules, which is the safe direction",
]
evidence = [
