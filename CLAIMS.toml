[[claim]]
id = "signed-policy-authority-is-verified"
kind = "capability"
text = "A distributed policy layer is accepted only when signed by a key in the repository's committed trust root; `--require-signed-policy` refuses an unsigned or wrongly-signed layer before the build starts, and the report and attestation record which key verified."
where = ["docs/CONFIG.md", "SECURITY.md"]
context = """
`policy_sha256` proves a layer is byte-identical to what was recorded, which is integrity, not
authority — a curl'd bundle hashes the same as a committed one. The trust root, committed in
the repository under CODEOWNERS, supplies the authority: a detached `<layer>.sig` verified by
Ed25519 (ring, verify-only). The committed anchor is never itself signature-checked — its
authority is that it is committed — so this verifies the DISTRIBUTED layers it pulls in. The
whole thing is a build-time content decision: no live fetch, and the failure is a refusal
before cargo, not after a target directory is half written.
"""
assumptions = [
  "Signing lives with the signer, air-gapped and outside this repository; this binary verifies and cannot sign. Distribution (a pull request, or a CI step that curls a signed bundle) happens outside the enforcing binary, which only ever verifies bytes already on disk.",
]
evidence = [
  "test:a_signed_distributed_layer_verifies_and_the_report_names_the_signer",
  "test:an_unsigned_distributed_layer_is_refused_under_require_signed_policy",
  "test:a_layer_signed_by_an_untrusted_key_is_refused",
  "test:an_unsigned_distributed_layer_is_recorded_and_refused_only_when_required",
]
checked = "2026-09-16"

[[claim]]
id = "no-vendor-trust-root-in-the-free-binary"
kind = "capability"
text = "cargo-buildclamp compiles in no vendor trust root: the key that verifies a policy signature is always the customer's, read from their committed policy, and the verification path makes no network request."
where = ["SECURITY.md", "docs/CONFIG.md"]
context = """
A vendor key baked into the free binary would make a vendor's key rotation or lapse a
customer's build outage, and would make the vendor an authority over what a customer's builds
may do. So there is none. The one asymmetric-crypto implementation is ring (verify-only in
the free binary), and the only hand-written primitive is the content-naming SHA-256; no
ed25519-dalek, so a review counts one asymmetric library. This closes the
conflict the SIGNALS review flagged as major — SECURITY.md's cryptography answer is now
stated per artefact rather than as one sentence that was true of only one artefact.
"""
evidence = [
  "test:no_ed25519_key_is_hardcoded_in_the_free_binary",
  "test:the_verification_path_reads_from_disk_and_never_the_network",
  "test:the_trust_root_is_built_from_customer_policy_data",
]
checked = "2026-09-16"

