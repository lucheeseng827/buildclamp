[[claim]]
id = "a-version-one-policy-keeps-working"
kind = "capability"
text = "A policy written at format version 1 still parses, resolves the same envelopes, and needs no migration to keep a build working."
where = ["docs/CONFIG.md", "CHANGELOG.md"]
context = """
Only the FUTURE is refused; the past is read and upgraded in memory on every run, and the
file on disk is untouched until somebody runs `policy migrate`. A version bump that rejected
every file in the field would make the tool the reason a build broke on the day it was
upgraded, and the answer would be to pin it.
"""
assumptions = [
  "`policy migrate` re-resolves every grant against the original before it writes, and refuses rather than produce a file whose meaning moved",
]
evidence = [
