kind = "capability"
text = "The attestation verifier accepts predicate format versions 1 and 2, refuses a version from the future rather than reading the parts it recognises, and refuses a version-1 statement after its stated sunset (2028-01-01) rather than silently."
where = ["schemas/v1/attestation.schema.json", "CHANGELOG.md"]
context = """
The migration story written before the format is shipped, while the count of issued
statements is near zero. A future version is refused because reading a newer document on the
parts an older verifier understands is the permissive direction, wrong for a signature. v1 is
read until its sunset and refused after, with an error that names the date, because a v1
statement was valid when written and a format nobody re-issues is a format nobody audits. The
verifier takes `today` as an argument — the pure crate has no clock — so the cutover is
testable at any date.
"""
